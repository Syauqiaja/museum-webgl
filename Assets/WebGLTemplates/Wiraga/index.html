<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- user-scalable=no is what stops a double-tap zooming the board mid-move.
         viewport-fit=cover puts the canvas under the notch instead of beside it. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading">
        <div id="unity-progress-bar"><div id="unity-progress-fill"></div></div>
      </div>
    </div>

    <div id="rotate-overlay">
      <p>Putar HP kamu ke samping</p>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var fill = document.querySelector("#unity-progress-fill");

      // A 3x phone screen otherwise asks the GPU for roughly nine times the pixels of a 1x one.
      var pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      function fitCanvas() {
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
      }
      fitCanvas();
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", fitCanvas);

      // Build/ is served immutable for a year and the four payload filenames never change
      // between builds, so a browser that has loaded this site before will happily pair a
      // cached framework.js with a freshly downloaded wasm. When a build adds or removes a
      // .jslib function that is exactly a LinkError at instantiate ("function import requires
      // a callable") that no amount of reloading clears. BuildWebGL.StampCacheBuster rewrites
      // BUILDSTAMP in the emitted index.html to the build time; index.html itself is no-cache,
      // so a new build invalidates all four URLs on the next visit.
      var v = "?v=BUILDSTAMP";

      var config = {
        dataUrl: "Build/{{{ DATA_FILENAME }}}" + v,
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}" + v,
        codeUrl: "Build/{{{ CODE_FILENAME }}}" + v,
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: pixelRatio
      };

      var script = document.createElement("script");
      script.src = "Build/{{{ LOADER_FILENAME }}}" + v;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function (instance) {
          // MuseumRequestFullscreen in MuseumPlatform.jslib looks for this.
          window.unityInstance = instance;
          loading.style.display = "none";
        }).catch(function (message) {
          loading.textContent = message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
